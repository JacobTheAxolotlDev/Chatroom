  <script>
   /* Get the element you want displayed in fullscreen */ 
var elem = document.getElementById("gameplayer");

/* Function to open fullscreen mode */
function openFullscreen() {
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) { /* Safari */
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) { /* IE11 */
    elem.msRequestFullscreen();
  }
}
</script>

      width: 1265px;
      height: 666px;
    }
</style>
  <div id="gameplayer">
<iframe src="https://kartbros.io" frameborder="0" allow="autoplay" allowfullscreen="" seamless="" scrolling="no"width="1265" height="666"></iframe>
</div>
<button onclick="openFullscreen()">open in full screen </button>
