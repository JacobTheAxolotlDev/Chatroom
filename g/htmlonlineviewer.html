<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Editor with Built-in Console</title>
  <style>
    :root {
      --green-1: #b7e4c7;
      --green-2: #5a9e67;
      --green-3: #3c6e40;
      --panel: #ffffff;
      --panel-2: #e3f3e8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      flex-direction: row;
    }

    .container {
      display: flex;
      width: 100%;
    }

    .side-bar {
      width: 213px;
      background-color: var(--green-2);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      color: white;
      height: 100%;
      position: sticky;
      top: 0;
    }

    .side-bar button {
      padding: 10px 15px;
      background-color: var(--green-3);
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
      text-align: left;
      width: 100%;
    }

    .side-bar button:hover {
      background-color: var(--green-1);
    }

    .editor-container {
      display: flex;
      flex-direction: column;
      width: 542px;
      height: 100vh;
      background-color: var(--panel-2);
    }

    #code-editor {
      width: 100%;
      height: 100%;
      padding: 10px;
      border: 1px solid var(--green-3);
      font-family: "Courier New", monospace;
      font-size: 14px;
      background-color: var(--panel);
      resize: none;
    }

    .preview-panel-container {
      display: flex;
      flex-direction: column;
      width: 628px;
      height: 100vh;
      border-left: 1px solid var(--green-3);
      background-color: var(--panel);
    }

    #preview-panel {
      flex: 1;
      border: none;
      width: 100%;
    }

    #console-panel {
      height: 150px;
      background-color: #111;
      color: #eee;
      font-family: "Courier New", monospace;
      font-size: 13px;
      overflow-y: auto;
      border-top: 1px solid var(--green-3);
      padding: 5px;
    }

    .log { color: #b0ffb0; }
    .error { color: #ff8080; }
    .warn { color: #fff6a9; }
    .info { color: #9ecbff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="side-bar">
      <button id="open-preview-btn">Preview (Full page)</button>
      <button id="import-btn">Import</button>
      <button id="export-btn">Export</button>
    </div>

    <div class="editor-container">
      <textarea id="code-editor" placeholder="Put your HTML text here"></textarea>
    </div>

    <div class="preview-panel-container">
      <iframe id="preview-panel"></iframe>
      <div id="console-panel"></div>
    </div>
  </div>

  <script>
    const codeEditor = document.getElementById("code-editor");
    const previewPanel = document.getElementById("preview-panel");
    const consolePanel = document.getElementById("console-panel");

    function appendToConsole(type, message) {
      const entry = document.createElement("div");
      entry.className = type;
      entry.textContent = `[${type}] ${message}`;
      consolePanel.appendChild(entry);
      consolePanel.scrollTop = consolePanel.scrollHeight;
    }

    // Listen for messages from iframe
    window.addEventListener("message", (event) => {
      if (event.data?.source === "iframe-console") {
        appendToConsole(event.data.type, event.data.message);
      }
    });

    // Inject script inside iframe after content loads
    function injectConsoleCapture() {
      const doc = previewPanel.contentDocument;
      if (!doc) return;
      const script = doc.createElement("script");
      script.textContent = `
        (function() {
          function send(type, message) {
            window.parent.postMessage({ source: 'iframe-console', type, message: String(message) }, '*');
          }

          ['log', 'error', 'warn', 'info', 'debug'].forEach(function(method) {
            const original = console[method];
            console[method] = function(...args) {
              const text = args.map(a => {
                if (typeof a === 'object') {
                  try { return JSON.stringify(a); } catch { return '[object]'; }
                }
                return String(a);
              }).join(' ');
              send(method, text);
              original.apply(console, args);
            };
          });

          console.clear = function() {
            send('info', 'Console cleared');
          };

          window.onerror = function(message, source, lineno, colno) {
            send('error', message + ' (' + lineno + ':' + colno + ')');
          };
        })();
      `;
      doc.body.appendChild(script);
    }

    // Update iframe preview with user code
    codeEditor.addEventListener("input", function () {
      const code = codeEditor.value;
      const doc = previewPanel.contentDocument || previewPanel.contentWindow.document;
      doc.open();
      doc.write(code);
      doc.close();
      previewPanel.onload = injectConsoleCapture;
    });

    // Import HTML file
    document.getElementById("import-btn").addEventListener("click", function () {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".html,.mhtml";
      input.addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => (codeEditor.value = event.target.result);
          reader.readAsText(file);
        }
      });
      input.click();
    });

    // Export HTML file
    document.getElementById("export-btn").addEventListener("click", function () {
      const blob = new Blob([codeEditor.value], { type: "text/html" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "index.html";
      link.click();
    });

    // Full-page preview
    document.getElementById("open-preview-btn").addEventListener("click", function () {
      const code = codeEditor.value;
      const previewWindow = window.open("about:blank", "_blank");
      previewWindow.document.open();
      previewWindow.document.write(code);
      previewWindow.document.close();
    });
  </script>
</body>
</html>
