 <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Friends Chatroom - Channels</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      margin: 0;
      background-color: #b7e4c7;
      font-family: "Comic Neue", cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    #header {
      width: 100%;
      background-color: #5a9e67;
      color: white;
      padding: 15px 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      gap: 50px;
      user-select: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    #header a {
      color: inherit;
      text-decoration: none;
    }
    #chat {
      width: 420px;
      margin: 30px 0;
      padding: 15px 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #channels {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
    .channel-tab {
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      background: #a3c19c;
      color: white;
      font-weight: bold;
      user-select: none;
      transition: background-color 0.3s ease;
      text-transform: capitalize;
      flex-shrink: 0;
    }
    .channel-tab.active,
    .channel-tab:hover {
      background-color: #5a9e67;
    }
    #messages {
      width: 100%;
      height: 320px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 8px;
      margin-bottom: 15px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      background: #fefefe;
      border-radius: 6px;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    input,
    button {
      font-family: "Comic Neue", cursive, sans-serif;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #5a9e67;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    #name {
      width: 28%;
      margin-right: 2%;
    }
    #msg {
      width: 60%;
      margin-right: 2%;
    }
    #send {
      width: 10%;
      background-color: #5a9e67;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    #send:hover {
      background-color: #3c6e40;
    }

    /* Rainbow animated text */
    .rainbow-text {
      background-image: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        green,
        blue,
        indigo,
        violet,
        red
      );
      background-size: 400% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 6s linear infinite;
    }
    @keyframes rainbowShift {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 100% 50%;
      }
    }

    /* Gold shimmering text */
    .gold-text {
      background-image: linear-gradient(
        90deg,
        #b8860b,
        #ffd700,
        #fffacd,
        #ffd700,
        #b8860b
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldShift 4s ease-in-out infinite;
    }
    @keyframes goldShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Uranium glowing green */
    .uranium-text {
      color: #00ff00;
      animation: uraniumGlow 1s ease-in-out infinite;
      text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 20px #00ff00,
        0 0 40px #00cc00;
    }
    @keyframes uraniumGlow {
      0%,
      100% {
        color: #00ff00;
        text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 20px #00ff00,
          0 0 40px #00cc00;
      }
      50% {
        color: #66ff66;
        text-shadow: 0 0 10px #66ff66, 0 0 20px #66ff66, 0 0 30px #33ff33,
          0 0 50px #00cc00;
      }
    }

    /* Slime gradient text */
    .slime-text {
      background-image: linear-gradient(90deg, #004d00, #00ff66);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Axey effect */
    .axey-container {
      position: relative;
      display: inline-block;
      padding: 20px;
      color: purple;
      font-weight: bold;
    }
    .axey-img {
      position: absolute;
      width: 30px;
      height: 30px;
      animation: axeyOrbit 3s linear infinite;
      pointer-events: none;
      user-select: none;
    }
    .axey-img.second {
      animation-delay: 1.5s;
    }
    @keyframes axeyOrbit {
      0% {
        transform: rotate(0deg) translateX(50px) rotate(0deg);
      }
      100% {
        transform: rotate(360deg) translateX(50px) rotate(-360deg);
      }
    }

    /* Pokémon style */
    .pokemon-container {
      position: relative;
      display: inline-block;
      padding: 20px;
      color: white;
      font-weight: bold;
      text-shadow:
        -2px -2px 0 red,
        2px -2px 0 red,
        -2px 2px 0 red,
        2px 2px 0 red;
      user-select: none;
    }
    .pokemon-img {
      position: absolute;
      width: 30px;
      height: 30px;
      animation: pokemonOrbit 3s linear infinite;
      pointer-events: none;
      user-select: none;
    }
    .pokemon-img.second {
      animation-delay: 1.5s;
    }
    @keyframes pokemonOrbit {
      0% {
        transform: rotate(0deg) translateX(50px) rotate(0deg);
      }
      100% {
        transform: rotate(360deg) translateX(50px) rotate(-360deg);
      }
    }

    /* Fweh style */
    .fweh-text {
      font-size: 2em;
      font-weight: bold;
      font-style: italic;
    }

    /* Tips box */
    #tips {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
      background: #e3f3e8;
      border: 1px solid #8bc791;
      border-radius: 6px;
      padding: 10px;
      width: 420px;
      box-sizing: border-box;
      user-select: none;
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="header">
    <div><a href="#">Chat Room</a></div>
    <div><a href="music.html">Music (wip)</a></div>
    <div><a href="other.html">Axey Game</a></div>
    <div><a href="desmos.html">calculator</a></div>
  </div>

  <div id="chat">
    <h2>Friends Chatroom</h2>
    <div id="channels"></div>
    <div id="messages"></div>
    <input id="name" placeholder="Name" autocomplete="off" />
    <input id="msg" placeholder="Message" autocomplete="off" />
    <button id="send">Send</button>
    <div id="tips">
      <strong>Tips:</strong> <br />
      To color a message, start with "red:", "blue:", "green:", or hex like
      "#ff6600:". <br />
      Try special styles too: "rainbow:", "gold:", "uranium:", "slime:", "axey:",
      "pokemon:", or "fweh:". <br />
      Example: <code>pokemon: Gotta catch 'em all!</code>
    </div>
  </div>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      onChildAdded,
      query,
      orderByChild,
      get
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYJW83DPFsEBNM1wV_3SJ0sT8aerGPx7A",
      authDomain: "chatroomfunyay.firebaseapp.com",
      databaseURL: "https://chatroomfunyay-default-rtdb.firebaseio.com",
      projectId: "chatroomfunyay",
      storageBucket: "chatroomfunyay.firebasestorage.app",
      messagingSenderId: "741967066444",
      appId: "1:741967066444:web:b6e386b842d3c29febcbe9",
      measurementId: "G-4CXD16WBVL",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const messagesDiv = document.getElementById("messages");
    const nameInput = document.getElementById("name");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const channelsDiv = document.getElementById("channels");

    let channels = new Set();
    let allMessages = [];
    let currentChannel = "general";

    function cleanMessage(text) {
      return text;
    }

    async function loadChannels() {
      const messagesRef = ref(db, "messages");
      const snapshot = await get(messagesRef);
      if (!snapshot.exists()) {
        channels = new Set(["general"]);
        currentChannel = "general";
        renderChannels();
        return;
      }
      channels.clear();
      allMessages = [];
      snapshot.forEach((child) => {
        const msg = child.val();
        allMessages.push(msg);
        channels.add(msg.channel || "general");
      });

      if (!channels.has(currentChannel)) {
        currentChannel = [...channels][0];
      }
      renderChannels();
      displayMessagesForChannel(currentChannel);
    }

    function renderChannels() {
      channelsDiv.innerHTML = "";
      [...channels]
        .sort()
        .forEach((channel) => {
          const tab = document.createElement("div");
          tab.textContent = channel;
          tab.className = "channel-tab";
          if (channel === currentChannel) tab.classList.add("active");
          tab.onclick = () => {
            if (currentChannel !== channel) {
              currentChannel = channel;
              updateActiveTab();
              displayMessagesForChannel(currentChannel);
            }
          };
          channelsDiv.appendChild(tab);
        });
    }

    function updateActiveTab() {
      const tabs = channelsDiv.querySelectorAll(".channel-tab");
      tabs.forEach((tab) => {
        tab.classList.toggle("active", tab.textContent === currentChannel);
      });
    }

    function addMessageElement(data) {
      let name = data.name || "Anonymous";

      if (name.trim().toLowerCase() === "logan") {
        name += " 👑";
      }
      if (name.trim().toLowerCase() === "jahmal") {
        name += " 🦐";
      }

      let text = data.text || "(no message)";
      const timestamp = new Date(data.timestamp).toLocaleTimeString();

      if ((data.channel || "general") !== currentChannel) return;

      let color = null;
      let rainbow = false;
      let gold = false;
      let uranium = false;
      let slime = false;
      let axey = false;
      let fweh = false;
      let pokemon = false;

      const namedColorMatch = text.match(/^(red|blue|green|orange|purple|white|yellow):\s*(.*)/i);
      const rainbowMatch = text.match(/^rainbow:\s*(.*)/i);
      const goldMatch = text.match(/^gold:\s*(.*)/i);
      const uraniumMatch = text.match(/^uranium:\s*(.*)/i);
      const slimeMatch = text.match(/^slime:\s*(.*)/i);
      const axeyMatch = text.match(/^axey:\s*(.*)/i);
      const fwehMatch = text.match(/^fweh:\s*(.*)/i);
      const pokemonMatch = text.match(/^pokemon:\s*(.*)/i);
      const hexMatch = text.match(/^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6}):\s*(.*)/);

      if (namedColorMatch) {
        color = namedColorMatch[1].toLowerCase();
        text = namedColorMatch[2];
      } else if (rainbowMatch) {
        rainbow = true;
        text = rainbowMatch[1];
      } else if (goldMatch) {
        gold = true;
        text = goldMatch[1];
      } else if (uraniumMatch) {
        uranium = true;
        text = uraniumMatch[1];
      } else if (slimeMatch) {
        slime = true;
        text = slimeMatch[1];
      } else if (axeyMatch) {
        axey = true;
        text = axeyMatch[1];
      } else if (fwehMatch) {
        fweh = true;
        text = fwehMatch[1];
      } else if (pokemonMatch) {
        pokemon = true;
        text = pokemonMatch[1];
      } else if (hexMatch) {
        color = `#${hexMatch[1]}`;
        text = hexMatch[2];
      }

      const msgEl = document.createElement("div");

      if (rainbow || gold || uranium || slime || axey || fweh || pokemon || color) {
        if (rainbow) {
          const msgContent = document.createElement("span");
          msgContent.classList.add("rainbow-text");
          msgContent.textContent = `${timestamp} - ${name}: ${text}`;
          msgEl.appendChild(msgContent);
        } else if (gold) {
          const msgContent = document.createElement("span");
          msgContent.classList.add("gold-text");
          msgContent.textContent = `${timestamp} - ${name}: ${text}`;
          msgEl.appendChild(msgContent);
        } else if (uranium) {
          const msgContent = document.createElement("span");
          msgContent.classList.add("uranium-text");
          msgContent.textContent = `${timestamp} - ${name}: ${text}`;
          msgEl.appendChild(msgContent);
        } else if (slime) {
          const msgContent = document.createElement("span");
          msgContent.classList.add("slime-text");
          msgContent.textContent = `${timestamp} - ${name}: ${text}`;
          msgEl.appendChild(msgContent);
        } else if (axey) {
          const axeyContainer = document.createElement("div");
          axeyContainer.classList.add("axey-container");
          axeyContainer.textContent = `${timestamp} - ${name}: ${text}`;
          const axey1 = document.createElement("img");
          axey1.src = "./axey.png";
          axey1.classList.add("axey-img");
          const axey2 = document.createElement("img");
          axey2.src = "./axey.png";
          axey2.classList.add("axey-img", "second");
          axeyContainer.appendChild(axey1);
          axeyContainer.appendChild(axey2);
          msgEl.appendChild(axeyContainer);
        } else if (pokemon) {
          const pokemonContainer = document.createElement("div");
          pokemonContainer.classList.add("pokemon-container");
          pokemonContainer.textContent = `${timestamp} - ${name}: ${text}`;

          const pokeball1 = document.createElement("img");
          pokeball1.src = "./image-removebg-preview_-_2025-08-12T192644.788.png";
          pokeball1.classList.add("pokemon-img");

          const pokeball2 = document.createElement("img");
          pokeball2.src = "./image-removebg-preview_-_2025-08-12T192644.788.png";
          pokeball2.classList.add("pokemon-img", "second");

          pokemonContainer.appendChild(pokeball1);
          pokemonContainer.appendChild(pokeball2);
          msgEl.appendChild(pokemonContainer);
        } else if (fweh) {
          const msgContent = document.createElement("span");
          msgContent.classList.add("fweh-text");
          msgContent.textContent = `${timestamp} - ${name}: ${text}`;
          msgEl.appendChild(msgContent);
        } else if (color) {
          const msgContent = document.createElement("span");
          msgContent.style.color = color;
          msgContent.textContent = `${timestamp} - ${name}: ${text}`;
          msgEl.appendChild(msgContent);
        }
      } else {
        const msgContent = document.createElement("span");
        msgContent.textContent = `${timestamp} - ${name}: ${text}`;
        msgEl.appendChild(msgContent);
      }

      messagesDiv.appendChild(msgEl);
    }

    function displayMessagesForChannel(channel) {
      messagesDiv.innerHTML = "";
      allMessages.forEach((msg) => {
        if ((msg.channel || "general") === channel) {
          addMessageElement(msg);
        }
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    const messagesRef = ref(db, "messages");
    const messagesQuery = query(messagesRef, orderByChild("timestamp"));

    onChildAdded(messagesQuery, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      allMessages.push(data);
      channels.add(data.channel || "general");
      renderChannels();
      if ((data.channel || "general") === currentChannel) {
        addMessageElement(data);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    });

    sendBtn.onclick = () => {
      const name = nameInput.value.trim() || "Anonymous";
      let text = msgInput.value.trim();
      if (!text) return;

      const messageObj = {
        name,
        text: cleanMessage(text),
        timestamp: Date.now(),
        channel: currentChannel,
      };

      push(ref(db, "messages"), messageObj);
      msgInput.value = "";
    };

    loadChannels();
  </script>
</body>
</html>
