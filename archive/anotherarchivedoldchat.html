<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel - Friends Chatroom</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
<style>
  body {
    margin: 0;
    background-color: #b7e4c7;
    font-family: 'Comic Neue', cursive, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  #header {
    width: 100%;
    background-color: #5a9e67;
    color: white;
    padding: 15px 20px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    gap: 50px;
    user-select: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #chat {
    width: 720px;
    max-width: calc(100% - 40px);
    margin: 30px 0;
    padding: 15px 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }

  /* tabs */
  #channel-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #channel-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 70%;
  }
  .tab {
    padding: 6px 12px;
    border: 1px solid #5a9e67;
    border-radius: 6px;
    cursor: pointer;
    background: #e1f5e4;
    user-select: none;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab.active {
    background: #5a9e67;
    color: white;
    font-weight: bold;
  }

  #admin-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    max-width: 30%;
  }
  #messages {
    width: 100%;
    height: 380px;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 12px;
    background: #fefefe;
    border-radius: 6px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-size: 15px;
  }
  .message-row {
    margin-bottom: 8px;
    line-height: 1.2;
  }

  input, button {
    font-family: 'Comic Neue', cursive, sans-serif;
    padding: 8px;
    border: 1px solid #5a9e67;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  #name { width: 20%; min-width: 120px; }
  #msg { flex: 1; min-width: 200px; }
  #send {
    background-color: #5a9e67;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
    padding: 10px 14px;
  }
  #send:hover { background-color: #3c6e40; }

  /* effects from original */
  .rainbow-text {
    background-image: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet, red);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowShift 6s linear infinite;
  }
  @keyframes rainbowShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

  .gold-text {
    background-image: linear-gradient(90deg, #b8860b, #ffd700, #fffacd, #ffd700, #b8860b);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: goldShift 4s ease-in-out infinite;
  }
  @keyframes goldShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .uranium-text {
    color: #00ff00;
    animation: uraniumGlow 1s ease-in-out infinite;
    text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 40px #00cc00;
  }
  @keyframes uraniumGlow {
    0%, 100% { color: #00ff00; text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 40px #00cc00; }
    50% { color: #66ff66; text-shadow: 0 0 10px #66ff66, 0 0 20px #66ff66, 0 0 30px #33ff33, 0 0 50px #00cc00; }
  }

  .slime-text {
    background-image: linear-gradient(90deg, #004d00, #00ff66);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .axey-container {
    position: relative;
    display: inline-block;
    padding: 6px 10px;
    color: purple;
    font-weight: bold;
  }
  .axey-img {
    position: absolute;
    width: 24px;
    height: 24px;
    animation: axeyOrbit 3s linear infinite;
  }
  .axey-img.second { animation-delay: 1.5s; }
  @keyframes axeyOrbit {
    0%   { transform: rotate(0deg) translateX(40px) rotate(0deg); }
    100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
  }

  .fweh-text {
    font-size: 1.2em;
    font-weight: bold;
    font-style: italic;
  }

  /* small admin UI */
  #admin-area { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
  .small-btn { padding: 6px 8px; border-radius: 6px; cursor:pointer; background: #eee; border: 1px solid #ccc; }
  .danger { background: #ff4d4d; color:white; border: 1px solid #e04040; }
  .mono { font-family: monospace; font-size: 12px; color:#333; background:#fafafa; padding:4px 6px; border-radius:4px; border:1px solid #eee; }
</style>
</head>
<body>
  <div id="header">
    <div><a href="" style="color: inherit; text-decoration: none;">Chat Room</a></div>
    <div><a href="music.html" style="color: inherit; text-decoration: none;">Music (wip)</a></div>
    <div><a href="other.html" style="color: inherit; text-decoration: none;">Axey Game</a></div>
    <div><a href="desmos.html" style="color: inherit; text-decoration: none;">calculator</a></div>
  </div>

  <div id="chat">
    <h2>Friends Chatroom - Admin Panel</h2>

    <div id="channel-row">
      <div id="channel-tabs" aria-label="Channels"></div>

      <div id="admin-controls">
        <input id="new-channel" placeholder="New channel name" style="padding:6px;border-radius:6px;border:1px solid #999;" autocomplete="off" />
        <button id="create-channel" class="small-btn">Create</button>
        <div id="admin-area">
          <button id="migrate-legacy" class="small-btn">Migrate legacy</button>
          <button id="cleanup-old" class="small-btn">Cleanup old</button>
          <span class="mono">DB: <span id="db-url">chatroomfunyay-default-rtdb</span></span>
        </div>
      </div>
    </div>

    <div id="messages" aria-live="polite"></div>

    <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
      <input id="name" placeholder="Name" autocomplete="off" />
      <input id="msg" placeholder="Message" autocomplete="off" style="flex:1" />
      <button id="send">Send</button>
    </div>

    <div style="margin-top:8px; font-size:12px; color:#444;">
      Tip: for special text, start your message with <code>red: ...</code>, <code>#00ff00: ...</code>, or <code>rainbow: ...</code>, <code>gold: ...</code>, <code>uranium: ...</code>, <code>slime: ...</code>, <code>axey: ...</code>, <code>fweh: ...</code>.<br>
      (Same behavior as your old client.)
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getDatabase, ref, push, onChildAdded, off, get, query, orderByChild, remove, update
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

  // --- FIREBASE CONFIG (same as your project) ---
  const firebaseConfig = {
    apiKey: "AIzaSyBYJW83DPFsEBNM1wV_3SJ0sT8aerGPx7A",
    authDomain: "chatroomfunyay.firebaseapp.com",
    databaseURL: "https://chatroomfunyay-default-rtdb.firebaseio.com",
    projectId: "chatroomfunyay",
    storageBucket: "chatroomfunyay.firebasestorage.app",
    messagingSenderId: "741967066444",
    appId: "1:741967066444:web:b6e386b842d3c29febcbe9",
    measurementId: "G-4CXD16WBVL"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // UI refs
  const tabsContainer = document.getElementById('channel-tabs');
  const messagesDiv = document.getElementById('messages');
  const nameInput = document.getElementById('name');
  const msgInput = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  const createChannelBtn = document.getElementById('create-channel');
  const newChannelInput = document.getElementById('new-channel');
  const migrateBtn = document.getElementById('migrate-legacy');
  const cleanupBtn = document.getElementById('cleanup-old');
  const dbUrlSpan = document.getElementById('db-url');
  dbUrlSpan.textContent = (firebaseConfig.databaseURL || '').replace(/^https?:\/\//, '');

  // Config
  const bannedWords = []; // add any banned words here
  const legacyPaths = ['messages', 'messeges']; // old legacy paths

  // Internals
  let currentChannel = 'general';
  let activeListeners = [];
  let displayedIds = new Set();

  // Store all channels found from messages and channelsList node
  let channelsSet = new Set();

  // Clean message text for banned words
  function cleanMessageText(text) {
    let clean = text;
    for (const w of bannedWords) {
      const re = new RegExp(`\\b${w}\\b`, 'gi');
      clean = clean.replace(re, "----");
    }
    return clean;
  }

  // Attach child_added with tracking to detach later
  function attachChildAdded(path, cbHandler) {
    const dbRef = ref(db, path);
    const cb = (snap) => cbHandler(snap, path);
    onChildAdded(dbRef, cb);
    activeListeners.push({ dbRef, event: 'child_added', cb });
    return { dbRef, cb };
  }

  // Detach all listeners
  function detachAllListeners() {
    for (const l of activeListeners) {
      try { off(l.dbRef, l.event, l.cb); } catch (e) { /* ignore */ }
    }
    activeListeners = [];
    displayedIds.clear();
  }

  // Parse and render a message snapshot
  function renderMessageSnapshot(snapshot) {
    const id = snapshot.key;
    if (displayedIds.has(id)) return;
    const data = snapshot.val() || {};
    if (!data.channel) return; // ignore messages without channel
    if (data.channel !== currentChannel) return;

    let name = (data.name || 'Anonymous').toString();
    let text = (data.text || '(no message)').toString();

    // Add emojis for special names
    const lcName = name.trim().toLowerCase();
    if (lcName === 'logan') name += ' 👑';
    if (lcName === 'jahmal') name += ' 🦐';

    // Parse styling prefixes
    let color = null;
    let rainbow = false, gold = false, uranium = false, slime = false, axey = false, fweh = false;

    const namedColorMatch = text.match(/^(red|blue|green|orange|purple|white|yellow):\s*(.*)/i);
    const rainbowMatch = text.match(/^rainbow:\s*(.*)/i);
    const goldMatch = text.match(/^gold:\s*(.*)/i);
    const uraniumMatch = text.match(/^uranium:\s*(.*)/i);
    const slimeMatch = text.match(/^slime:\s*(.*)/i);
    const axeyMatch = text.match(/^axey:\s*(.*)/i);
    const fwehMatch = text.match(/^fweh:\s*(.*)/i);
    const hexMatch = text.match(/^\(?#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})\)?:\s*(.*)/);

    if (namedColorMatch) {
      color = namedColorMatch[1].toLowerCase();
      text = namedColorMatch[2];
    } else if (rainbowMatch) {
      rainbow = true; text = rainbowMatch[1];
    } else if (goldMatch) {
      gold = true; text = goldMatch[1];
    } else if (uraniumMatch) {
      uranium = true; text = uraniumMatch[1];
    } else if (slimeMatch) {
      slime = true; text = slimeMatch[1];
    } else if (axeyMatch) {
      axey = true; text = axeyMatch[1];
    } else if (fwehMatch) {
      fweh = true; text = fwehMatch[1];
    } else if (hexMatch) {
      color = `#${hexMatch[1]}`;
      text = hexMatch[2];
    }

    // Clean banned words
    text = cleanMessageText(text);

    const row = document.createElement('div');
    row.className = 'message-row';
    const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';

    if (rainbow) {
      const el = document.createElement('span');
      el.className = 'rainbow-text';
      el.textContent = `${timestamp} - ${name}: ${text}`;
      row.appendChild(el);
    } else if (gold) {
      const el = document.createElement('span');
      el.className = 'gold-text';
      el.textContent = `${timestamp} - ${name}: ${text}`;
      row.appendChild(el);
    } else if (uranium) {
      const el = document.createElement('span');
      el.className = 'uranium-text';
      el.textContent = `${timestamp} - ${name}: ${text}`;
      row.appendChild(el);
    } else if (slime) {
      const el = document.createElement('span');
      el.className = 'slime-text';
      el.textContent = `${timestamp} - ${name}: ${text}`;
      row.appendChild(el);
    } else if (axey) {
      const cont = document.createElement('div');
      cont.className = 'axey-container';
      cont.textContent = `${timestamp} - ${name}: ${text}`;
      const img1 = document.createElement('img');
      img1.src = './axey.png';
      img1.className = 'axey-img';
      const img2 = document.createElement('img');
      img2.src = './axey.png';
      img2.className = 'axey-img second';
      cont.appendChild(img1);
      cont.appendChild(img2);
      row.appendChild(cont);
    } else if (fweh) {
      const el = document.createElement('span');
      el.className = 'fweh-text';
      el.textContent = `${timestamp} - ${name}: ${text}`;
      row.appendChild(el);
    } else {
      const el = document.createElement('span');
      el.textContent = `${timestamp} - ${name}: ${text}`;
      if (color) el.style.color = color;
      row.appendChild(el);
    }

    messagesDiv.appendChild(row);
    displayedIds.add(id);

    // Auto scroll to bottom
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // Load channels from channelsList and from messages channels
  async function loadChannels() {
    channelsSet.clear();

    // Load from channelsList node
    try {
      const channelsSnap = await get(ref(db, 'channelsList'));
      if (channelsSnap.exists()) {
        const chList = channelsSnap.val();
        Object.keys(chList).forEach(ch => channelsSet.add(ch));
      }
    } catch(e) { console.warn("Failed to load channelsList:", e); }

    // Load from messages (fetch last 100 for example)
    try {
      const msgsSnap = await get(query(ref(db, 'messages'), orderByChild('timestamp')));
      if (msgsSnap.exists()) {
        const msgs = msgsSnap.val();
        Object.values(msgs).forEach(m => {
          if (m.channel) channelsSet.add(m.channel);
        });
      }
    } catch(e) { console.warn("Failed to load messages channels:", e); }

    // If no channels, add default general
    if (channelsSet.size === 0) channelsSet.add('general');

    renderChannelTabs();
  }

  // Render channel tabs with current active
  function renderChannelTabs() {
    tabsContainer.innerHTML = '';
    const sortedChannels = [...channelsSet].sort();
    sortedChannels.forEach(ch => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (ch === currentChannel ? ' active' : '');
      tab.textContent = ch;
      tab.tabIndex = 0;
      tab.role = 'tab';
      tab.setAttribute('aria-selected', ch === currentChannel ? 'true' : 'false');
      tab.addEventListener('click', () => switchChannel(ch));
      tab.addEventListener('keypress', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          switchChannel(ch);
          e.preventDefault();
        }
      });
      tabsContainer.appendChild(tab);
    });
  }

  // Switch active channel: reload messages and update UI
  function switchChannel(channel) {
    if (channel === currentChannel) return;
    currentChannel = channel;
    renderChannelTabs();
    detachAllListeners();
    messagesDiv.innerHTML = '';
    displayedIds.clear();
    listenMessages();
  }

  // Listen to messages in current channel
  function listenMessages() {
    const messagesRef = ref(db, 'messages');
    const orderedQuery = query(messagesRef, orderByChild('timestamp'));
    onChildAdded(orderedQuery, snap => {
      const data = snap.val();
      if (data.channel === currentChannel) {
        renderMessageSnapshot(snap);
      }
    });
  }

  // Send new message
  async function sendMessage() {
    const name = nameInput.value.trim() || 'Anonymous';
    const textRaw = msgInput.value.trim();
    if (!textRaw) return alert('Message cannot be empty!');
    // Prevent banned words
    if (bannedWords.some(w => textRaw.toLowerCase().includes(w))) {
      return alert('Your message contains banned words.');
    }

    const text = textRaw;

    const newMsg = {
      name,
      text,
      timestamp: Date.now(),
      channel: currentChannel
    };

    try {
      await push(ref(db, 'messages'), newMsg);
      msgInput.value = '';
    } catch (e) {
      alert('Failed to send message: ' + e.message);
    }
  }

  // Create new channel
  async function createChannel() {
    const name = newChannelInput.value.trim();
    if (!name) return alert('Channel name cannot be empty');
    if (channelsSet.has(name)) return alert('Channel already exists');
    try {
      // Add to channelsList node
      await update(ref(db, `channelsList/${name}`), { created: Date.now() });
      channelsSet.add(name);
      newChannelInput.value = '';
      renderChannelTabs();
    } catch (e) {
      alert('Failed to create channel: ' + e.message);
    }
  }

  // Migrate legacy messages (from old legacy nodes)
  async function migrateLegacyMessages() {
    if (!confirm('This will migrate legacy messages into the new format. Proceed?')) return;

    for (const legacyPath of legacyPaths) {
      try {
        const legacySnap = await get(ref(db, legacyPath));
        if (!legacySnap.exists()) continue;
        const legacyMsgs = legacySnap.val();
        for (const key in legacyMsgs) {
          if (!legacyMsgs[key].text) continue;
          // Migrate each message to messages with channel 'general'
          await push(ref(db, 'messages'), {
            name: legacyMsgs[key].name || 'Anonymous',
            text: legacyMsgs[key].text,
            timestamp: legacyMsgs[key].timestamp || Date.now(),
            channel: legacyMsgs[key].channel || 'general'
          });
        }
        // Optionally remove legacy node after migration
        // await remove(ref(db, legacyPath));
      } catch (e) {
        alert('Failed migrating ' + legacyPath + ': ' + e.message);
      }
    }
    alert('Migration completed!');
    loadChannels();
    switchChannel('general');
  }

  // Cleanup old messages (e.g. older than 30 days)
  async function cleanupOldMessages() {
    if (!confirm('Delete messages older than 30 days? This cannot be undone.')) return;
    const cutoff = Date.now() - (30 * 24 * 60 * 60 * 1000);
    try {
      const msgsSnap = await get(ref(db, 'messages'));
      if (!msgsSnap.exists()) return alert('No messages to clean.');
      const msgs = msgsSnap.val();
      const toDelete = [];
      for (const key in msgs) {
        if (msgs[key].timestamp < cutoff) {
          toDelete.push(key);
        }
      }
      if (toDelete.length === 0) return alert('No messages older than 30 days.');
      for (const key of toDelete) {
        await remove(ref(db, `messages/${key}`));
      }
      alert('Cleanup complete, removed ' + toDelete.length + ' messages.');
    } catch (e) {
      alert('Cleanup failed: ' + e.message);
    }
  }

  // Event listeners
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  createChannelBtn.addEventListener('click', createChannel);
  newChannelInput.addEventListener('keydown', e => { if (e.key === 'Enter') createChannel(); });
  migrateBtn.addEventListener('click', migrateLegacyMessages);
  cleanupBtn.addEventListener('click', cleanupOldMessages);

  // Init
  (async function init() {
    await loadChannels();
    listenMessages();
  })();

</script>
</body>
</html>
