 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UID ↔ Username Finder</title>
  <style>
    :root {
      --bg: #242424;
      --panel: #ffa724;
      --text: #fff;
      --accent: #00ff8c;
    }
    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: var(--panel);
      padding: 20px 24px;
      border-radius: 16px;
      width: 340px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #000;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      transform: scale(1.05);
    }
    #result {
      margin-top: 14px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px;
      word-break: break-all;
      color: #000;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>UID ↔ Username Finder</h2>
    <input id="usernameInput" placeholder="Enter username..." />
    <button id="findUidBtn">Get UID</button>
    <hr style="border:none;height:1px;background:#000;margin:10px 0;">
    <input id="uidInput" placeholder="Enter UID..." />
    <button id="findUsernameBtn">Get Username</button>
    <div id="result"></div>
  </div>

  <script type="module">
    // 🔧 Your Firebase config (copy from your main site)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

    const firebaseConfig = {
    apiKey: "AIzaSyBYJW83DPFsEBNM1wV_3SJ0sT8aerGPx7A",
    authDomain: "chatroomfunyay.firebaseapp.com",
    databaseURL: "https://chatroomfunyay-default-rtdb.firebaseio.com",
    projectId: "chatroomfunyay",
    storageBucket: "chatroomfunyay.firebasestorage.app",
    messagingSenderId: "741967066444",
    appId: "1:741967066444:web:b6e386b842d3c29febcbe9",
    measurementId: "G-4CXD16WBVL",
  };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const usernameInput = document.getElementById("usernameInput");
    const uidInput = document.getElementById("uidInput");
    const result = document.getElementById("result");

    document.getElementById("findUidBtn").onclick = async () => {
      const username = usernameInput.value.trim().toLowerCase();
      if (!username) return show("Enter a username.");
      try {
        const snap = await get(child(ref(db), `usernames/${username}`));
        if (!snap.exists()) return show(`No UID found for '${username}'.`);
        show(`UID for '${username}':<br><b>${snap.val().uid}</b>`);
      } catch (e) {
        show("Error: " + e.message);
      }
    };

    document.getElementById("findUsernameBtn").onclick = async () => {
      const uid = uidInput.value.trim();
      if (!uid) return show("Enter a UID.");
      try {
        const snap = await get(child(ref(db), `users/${uid}`));
        if (!snap.exists()) return show("No username found for that UID.");
        const data = snap.val();
        show(`Username for ${uid}:<br><b>${data.username || "(unknown)"}</b>`);
      } catch (e) {
        show("Error: " + e.message);
      }
    };

    function show(msg){
      result.innerHTML = msg;
    }
  </script>
</body>
</html>
