  <style>
  /* =========================
     THEME VARIABLES (change these)
     ========================= */
  :root{
    --green-1:#9dab00;
    --green-2:#97fb54;
    --green-3:#a25910;
    --panel:#16ab11;
    --panel-2:#dec823;
    --card-bg: #ffffff;
    --muted: rgba(0,0,0,0.65);
    --accent-text: #111;
    --like-color: #FF0000;
  }

  /* Basic reset & layout to match your site */
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; font-family:"Comic Neue", cursive, sans-serif; background:var(--green-1); color:var(--accent-text);}
  a{color:inherit}
  .centered { max-width:1100px; margin:18px auto; padding:12px; display:flex; gap:12px; flex-direction:column; align-items:center; }

  /* header (matches your header style) */
  #header {
    width:100%;
    background:var(--green-2);
    color:#000;
    padding:12px 16px;
    font-weight:bold;
    display:flex;
    gap:24px;
    align-items:center;
    position:sticky; top:0; z-index:50;
    justify-content:center;
  }
  #header a { text-decoration:none; color:inherit; }

  /* small header-right area */
  #header-right {
  margin-left: auto;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center; /* Add this line */
}
  #whoami-mini { font-weight:700; color:#000; }

  /* Main content panel matching your chat panel style */
  #main-content {
    width: 920px;
    max-width: calc(100% - 40px);
    background: var(--panel);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    display:flex;
    gap:16px;
    flex-direction:column;
    align-items:center;
  }

  /* Auth box (matching your #auth) */
  #auth { width:420px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; background:var(--panel); border-radius:12px; padding:12px; }
  #auth input { flex:1 1 180px; padding:10px; border-radius:8px; border:1px solid var(--green-2); font-size:14px; }
  #auth button { padding:10px 12px; border-radius:8px; border:none; background:var(--green-2); color:#fff; font-weight:700; cursor:pointer; }
  #auth .secondary { background:#8fb79a; }

  #whoami { margin-top:8px; font-size:14px; color:var(--green-3); width:420px; text-align:center; font-weight:bold; }

  /* Posts layout */
  .layout { width:100%; display:flex; gap:16px; align-items:flex-start; justify-content:center; }
  #left-col { width: 620px; max-width:100%; display:flex; flex-direction:column; gap:12px; align-items:stretch; }
  #right-col { width: 260px; min-width:220px; display:flex; flex-direction:column; gap:12px; align-items:stretch; }

  /* Upload button (looks like your .upload-btn) */
  .upload-btn {
    display:inline-block;
    background:var(--panel-2);
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:800;
  }

  /* Post card (styled to fit your panels) */
  .post-card {
    background: var(--card-bg);
    border-radius:12px;
    padding:12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    display:flex; flex-direction:column; gap:8px;
    overflow:hidden;
  }
  .post-meta { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .post-title { font-weight:800; font-size:16px; }
  .post-author { font-size:12px; color:var(--muted); }
  .post-img { width:100%; border-radius:10px; object-fit:cover; max-height:420px; }

  /* actions */
  .post-actions { display:flex; gap:8px; align-items:center; }
  .like-btn { border:none; background:transparent; cursor:pointer; font-weight:800; font-size:15px; }
  .delete-btn { border:none; background:transparent; cursor:pointer; color:#700; }
  .comment-input { width:100%; padding:8px; border-radius:8px; border:1px solid #ddd; }

  /* comments area */
  .comments { background: #f0f0f0; padding:8px; border-radius:8px; display:flex; flex-direction:column; gap:6px; max-height:200px; overflow:auto; }
  .comment { font-size:13px; padding:6px; border-bottom:1px solid rgba(0,0,0,0.06); }
  .comment:last-child { border-bottom:none; }

  /* small helpers */
  .muted { color:var(--muted); font-size:13px; }
  .hidden { display:none !important; }

  /* responsiveness */
  @media (max-width:980px){
    .layout { flex-direction:column; }
    #right-col { width:100%; max-width:100%; }
    #left-col { width:100%; }
    #main-content { padding:10px; }
  }

  /* small polished touches */
  input[type="file"] { display:none; } /* we'll show our own upload modal */
  </style>
</head>

  <!-- Firebase + App JS -->
  <script type="module">
  /************************************************************************
   * Meme Board - Single file (HTML+CSS+JS)
   * - Uses your Firebase config & same username/password login approach
   * - Only three uploader UIDs (fill them below) can post
   * - Posts stored in Realtime DB as base64 images
   * - Likes and comments saved and realtime
   *
   * Paste this file into your project. Edit posterUIDs below.
   ************************************************************************/

  // --- Firebase imports (v12.1.0 like your script) ---
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getDatabase, ref, push, set, get, onValue, query, orderByChild
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

  import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  // ------------------ YOUR FIREBASE CONFIG (from your script) ------------------
  const firebaseConfig = {
  apiKey: "AIzaSyC0ppSfYRPCje-BusGftdn1kCMHgs-Z_BU",
  authDomain: "loganstoolsforschool.firebaseapp.com",
  databaseURL: "https://loganstoolsforschool-default-rtdb.firebaseio.com",
  projectId: "loganstoolsforschool",
  storageBucket: "loganstoolsforschool.firebasestorage.app",
  messagingSenderId: "883702419905",
  appId: "1:883702419905:web:8e9888e6d6f305ec165f40",
  measurementId: "G-P2HVQ9K0XD"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence); // keep user logged in (same as yours)

  // ------------------ DOM refs ------------------
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('login');
  const signupBtn = document.getElementById('signup');
  const logoutBtn = document.getElementById('logout');
  const whoami = document.getElementById('whoami');
  const whoamiMini = document.getElementById('whoami-mini');

  const uploaderArea = document.getElementById('uploader-area');
  const memeTitleInput = document.getElementById('meme-title');
  const memeFileInput = document.getElementById('meme-file');
  const postMemeBtn = document.getElementById('post-meme');
  const cancelMemeBtn = document.getElementById('cancel-meme');

  const postsFeed = document.getElementById('posts-feed');

  const uploadPreview = document.getElementById('upload-preview');
  const previewImg = document.getElementById('preview-img');
  const closePreviewBtn = document.getElementById('close-preview');
  const confirmPostBtn = document.getElementById('confirm-post');
  const cancelPostBtn = document.getElementById('cancel-post');

  // ------------------ Allowed uploaders (FILL these with UIDs) ------------------
  // Put the three UIDs here (string form). You said you'd paste them later — drop them in.
  const posterUIDs = new Set([
    "DawxSQun3uTvB8QIHidkqtlB42K3", // Logan (example from your script)
    "FF2pCJaZ3vRb1l3fYBYVnaFHcZk2", // Baylor
    "RWHIbw3eQTUYop1WNBAMcBY5JR32"            // <--- replace this with the 3rd UID
  ]);

  // --- Helpers: username <-> fake email (same method you use) ---
  function usernameToEmail(u){ return `${u}@myapp.local`.toLowerCase(); }

  // fetch username from /users/{uid}
  async function getUsernameForUID(uid){
    if(!uid) return null;
    try {
      const snap = await get(ref(db, `users/${uid}`));
      return snap.exists() ? snap.val().username : null;
    } catch(e){
      console.warn('getUsernameForUID', e);
      return null;
    }
  }

  // ------------------ AUTH: Sign up / Login / Logout (same behavior you had) ------------------
  signupBtn.addEventListener('click', async () => {
    const username = (usernameInput.value || "").trim();
    const password = passwordInput.value || "";
    if(!username) return alert('Enter a username');
    if(password.length < 6) return alert('Password must be at least 6 characters');

    const key = username.toLowerCase();
    const unameRef = ref(db, `usernames/${key}`);
    const taken = await get(unameRef);
    if(taken.exists()) return alert('Username is taken. Try another.');

    const fakeEmail = usernameToEmail(username);
    try {
      const cred = await createUserWithEmailAndPassword(auth, fakeEmail, password);
      // save profile and username->uid mapping
      await set(ref(db, `users/${cred.user.uid}`), { username });
      await set(unameRef, { uid: cred.user.uid });
      alert("Account created and logged in.");
      // clear inputs
      usernameInput.value = '';
      passwordInput.value = '';
      // auth state change will update UI
    } catch(e){
      alert(e.message);
    }
  });

  loginBtn.addEventListener('click', async () => {
    const username = (usernameInput.value || "").trim();
    const password = passwordInput.value || "";
    if(!username) return alert('Enter your username');
    try {
      await signInWithEmailAndPassword(auth, usernameToEmail(username), password);
      usernameInput.value = '';
      passwordInput.value = '';
    } catch(e){
      alert(e.message);
    }
  });

  logoutBtn.addEventListener('click', async () => {
    try { await signOut(auth); } catch(e){ alert(e.message); }
  });

  // ------------------ AUTH state changes: update UI & uploader visibility ------------------
  let currentUser = null;
  let currentUsername = null;

  onAuthStateChanged(auth, async (user) => {
    currentUser = user || null;
    if(user){
      // fetch username from /users if not stored in profile
      currentUsername = user.displayName || (await getUsernameForUID(user.uid)) || '(user)';
      whoami.textContent = `Logged in as: ${currentUsername}`;
      whoamiMini.textContent = currentUsername;
      logoutBtn.style.display = 'inline-block';
      // show uploader area only if uid matches posterUIDs
      if(posterUIDs.has(user.uid)) uploaderArea.classList.remove('hidden');
      else uploaderArea.classList.add('hidden');
    } else {
      whoami.textContent = 'Not logged in';
      whoamiMini.textContent = '';
      logoutBtn.style.display = 'none';
      uploaderArea.classList.add('hidden');
      currentUsername = null;
    }
  });

  // ------------------ Upload flow (preview -> confirm) ------------------
  let stagedDataURL = null; // holds the chosen image base64 until confirmed

  // When user picks a file, load preview
  memeFileInput.addEventListener('change', async (ev) => {
    const f = ev.target.files?.[0];
    if(!f) return;
    // keep images reasonably sized; not enforced but recommended
    const dataUrl = await fileToDataURL(f);
    stagedDataURL = dataUrl;
    previewImg.src = dataUrl;
    uploadPreview.classList.remove('hidden');
  });

  // helper to convert file->dataURL
  function fileToDataURL(file) {
    return new Promise((resolve,reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result));
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  closePreviewBtn.addEventListener('click', () => {
    stagedDataURL = null; uploadPreview.classList.add('hidden'); previewImg.src = '';
    memeFileInput.value = '';
  });
  cancelPostBtn.addEventListener('click', () => {
    stagedDataURL = null; uploadPreview.classList.add('hidden'); previewImg.src = '';
    memeFileInput.value = '';
  });

  // when Post clicked from uploader card -> show preview if not staged
  postMemeBtn.addEventListener('click', async () => {
    if(!currentUser) return alert('Sign in to upload.');
    if(!posterUIDs.has(currentUser.uid)) return alert('You are not allowed to upload memes.');

    const title = (memeTitleInput.value || '').trim();
    if(!title) return alert('Add a title.');

    // if no staged image, ask user to pick file
    if(!stagedDataURL) {
      // emulate clicking the hidden file input
      memeFileInput.click();
      return;
    }

    // show preview (already shown when staging) - user confirms
    uploadPreview.classList.remove('hidden');
  });

  // confirm -> write to database
  confirmPostBtn.addEventListener('click', async () => {
    if(!currentUser) return alert('Sign in to upload.');
    if(!posterUIDs.has(currentUser.uid)) return alert('Not an uploader.');

    const title = (memeTitleInput.value || '').trim();
    if(!title || !stagedDataURL) return alert('Missing title or image.');

    confirmPostBtn.disabled = true;
    confirmPostBtn.textContent = 'Posting...';

    try {
      const pRef = push(ref(db, 'posts'));
      await set(pRef, {
        title,
        image: stagedDataURL,
        authorUID: currentUser.uid,
        authorUsername: currentUsername || null,
        timestamp: Date.now()
      });
      // reset UI
      memeTitleInput.value = '';
      memeFileInput.value = '';
      stagedDataURL = null;
      previewImg.src = '';
      uploadPreview.classList.add('hidden');
    } catch(e){
      alert('Upload failed: ' + e.message);
    } finally {
      confirmPostBtn.disabled = false;
      confirmPostBtn.textContent = 'Confirm Post';
    }
  });

  // cancel from uploader card
  cancelMemeBtn.addEventListener('click', () => {
    memeTitleInput.value = '';
    memeFileInput.value = '';
    stagedDataURL = null;
    previewImg.src = '';
    uploadPreview.classList.add('hidden');
  });

  // ------------------ Posts rendering & realtime sync ------------------
  // We'll listen to entire posts node and render sorted by timestamp desc.
  const postsRef = ref(db, 'posts');

  // sanitize for text output
  function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

  // render single post
  function makePostElement(postId, postData){
    const container = document.createElement('div');
    container.className = 'post-card';
    container.id = `post-${postId}`;

    // header
    const header = document.createElement('div');
    header.className = 'post-meta';
    const title = document.createElement('div');
    title.innerHTML = `<div class="post-title">${escapeHtml(postData.title||'(no title)')}</div>
                       <div class="post-author">${escapeHtml(postData.authorUsername || postData.authorUID || 'Unknown')}</div>`;
    const time = document.createElement('div');
    time.className = 'muted';
    time.textContent = new Date(postData.timestamp || 0).toLocaleString();
    header.appendChild(title);
    header.appendChild(time);
    container.appendChild(header);

    // image (if present)
    const img = document.createElement('img');
    img.className = 'post-img';
    img.src = postData.image || '';
    img.alt = postData.title || 'meme';
    container.appendChild(img);

    // actions
    const actions = document.createElement('div');
    actions.className = 'post-actions';
    // like
    const likeBtn = document.createElement('button');
    likeBtn.className = 'like-btn';
    likeBtn.type = 'button';
    // initial label will be set by refreshLikes
    actions.appendChild(likeBtn);

    // delete (only shown to posterUIDs or post author)
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.innerText = '🗑️';
    delBtn.title = 'Delete post';
    delBtn.addEventListener('click', async () => {
      if(!currentUser) return alert('Sign in to delete.');
      if(!posterUIDs.has(currentUser.uid) && currentUser.uid !== postData.authorUID){
        return alert("You can't delete this post.");
      }
      if(!confirm('Delete this meme?')) return;
      await set(ref(db, `posts/${postId}`), null);
    });
    actions.appendChild(delBtn);

    container.appendChild(actions);

    // comments area
    const commentsArea = document.createElement('div');
    commentsArea.className = 'comments hidden';
    commentsArea.id = `comments-${postId}`;
    container.appendChild(commentsArea);

    // show comment input row
    const commentRow = document.createElement('div');
    commentRow.style.display = 'flex';
    commentRow.style.gap = '8px';
    const commentInput = document.createElement('input');
    commentInput.className = 'comment-input';
    commentInput.placeholder = 'Add a comment...';
    commentInput.addEventListener('keydown', async (e) => {
      if(e.key === 'Enter') {
        e.preventDefault();
        await addComment(postId, commentInput.value.trim());
        commentInput.value = '';
      }
    });
    const commentBtn = document.createElement('button');
    commentBtn.className = 'upload-btn';
    commentBtn.textContent = 'Comment';
    commentBtn.addEventListener('click', async () => {
      await addComment(postId, commentInput.value.trim());
      commentInput.value = '';
    });
    commentRow.appendChild(commentInput);
    commentRow.appendChild(commentBtn);
    container.appendChild(commentRow);

    // expand/collapse comments on clicking comments area (or image)
    img.addEventListener('click', () => {
      commentsArea.classList.toggle('hidden');
    });
    // show/hide delete button depending on current user later
    // We'll return element and also provide helper to refresh its likes/comments
    return { container, likeBtn, delBtn, commentsArea, commentInput, refresh: () => refreshPostUI(postId, postData, {likeBtn, delBtn, commentsArea, commentInput}) };
  }

  // update like button label and comment area for a specific post
  async function refreshPostUI(postId, postData, els){
    // read likes & comments for this post
    const likesSnap = await get(ref(db, `posts/${postId}/likes`));
    const commentsSnap = await get(ref(db, `posts/${postId}/comments`));

    const likes = likesSnap.exists() ? likesSnap.val() : {};
    const likeCount = Object.keys(likes).length;
    const likedByMe = currentUser && !!likes[currentUser.uid];

    // update like button label
    els.likeBtn.innerHTML = `${likedByMe ? '💖' : '🤍'} <span style="font-weight:700;color:var(--green-3)">${likeCount}</span>`;
    // like click handler (toggle)
    els.likeBtn.onclick = async () => {
      if(!currentUser) return alert('Sign in to like posts.');
      const likeRef = ref(db, `posts/${postId}/likes/${currentUser.uid}`);
      const snap = await get(likeRef);
      if(snap.exists()) await set(likeRef, null);
      else await set(likeRef, true);
    };

    // show/hide delete button
    if(currentUser && (posterUIDs.has(currentUser.uid) || currentUser.uid === postData.authorUID)){
      els.delBtn.style.display = '';
    } else els.delBtn.style.display = 'none';

    // render comments
    const commentsArea = els.commentsArea;
    commentsArea.innerHTML = '';
    if(commentsSnap.exists()){
      const commentsObj = commentsSnap.val();
      const commentsArr = Object.entries(commentsObj).sort((a,b)=> (a[1].timestamp||0)-(b[1].timestamp||0) );
      for(const [cid, c] of commentsArr){
        const div = document.createElement('div');
        div.className = 'comment';
        const author = c.authorUsername || c.authorUID || 'anon';
        div.innerHTML = `<strong>${escapeHtml(author)}</strong> <span class="muted" style="font-size:12px"> • ${new Date(c.timestamp||0).toLocaleString()}</span><div>${escapeHtml(c.text)}</div>`;
        commentsArea.appendChild(div);
      }
    } else {
      const empty = document.createElement('div');
      empty.className = 'muted';
      empty.textContent = 'No comments yet. Be first!';
      commentsArea.appendChild(empty);
    }
  }

  // REPLACE your existing addComment(...) with this function
async function addComment(postId, text){
  text = (text || '').trim();
  if (!text) return;
  if (!currentUser) return alert('Sign in to comment.');

  try {
    // push the comment
    const commentRef = push(ref(db, `posts/${postId}/comments`));
    await set(commentRef, {
      text,
      authorUID: currentUser.uid,
      authorUsername: currentUsername || null,
      timestamp: Date.now()
    });

    // make sure comment input caller has cleared its input (they already do),
    // now immediately expand the comments area so the user sees feedback:
    const commentsArea = document.getElementById(`comments-${postId}`);
    if (commentsArea && commentsArea.classList.contains('hidden')) commentsArea.classList.remove('hidden');

    // Re-fetch comments for this single post and re-render the comments area
    const commentsSnap = await get(ref(db, `posts/${postId}/comments`));
    commentsArea.innerHTML = '';
    if (commentsSnap.exists()){
      const commentsObj = commentsSnap.val();
      const commentsArr = Object.entries(commentsObj).sort((a,b)=> (a[1].timestamp||0) - (b[1].timestamp||0) );
      for (const [cid, c] of commentsArr){
        const div = document.createElement('div');
        div.className = 'comment';
        const author = c.authorUsername || c.authorUID || 'anon';
        div.innerHTML = `<strong>${escapeHtml(author)}</strong> <span class="muted" style="font-size:12px"> • ${new Date(c.timestamp||0).toLocaleString()}</span><div>${escapeHtml(c.text)}</div>`;
        commentsArea.appendChild(div);
      }
    } else {
      const empty = document.createElement('div');
      empty.className = 'muted';
      empty.textContent = 'No comments yet. Be first!';
      commentsArea.appendChild(empty);
    }

  } catch (e) {
    console.error('Failed to add comment', e);
    alert('Failed to post comment: ' + e.message);
  }
}


  // render all posts once snapshot changes
  onValue(postsRef, async (snap) => {
    const postsObj = snap.exists() ? snap.val() : {};
    // convert to array and sort desc by timestamp
    const postsArr = Object.entries(postsObj).map(([id,data]) => ({ id, ...data }))
                    .sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    postsFeed.innerHTML = '';
    for(const p of postsArr){
      const el = makePostElement(p.id, p);
      postsFeed.appendChild(el.container);
      // initial refresh UI
      await el.refresh();
    }
  });

  // helper: refresh specific post UI when likes/comments change (optional)
  // (we added full onValue listener above; DB updates will re-render)

  // ------------------ extras: keyboard enter send for comments (done above) ------------------

  // ------------------ small nice things: keep uploader visible when page loads for allowed uids (if already signed in) ------------------
  if(auth.currentUser && posterUIDs.has(auth.currentUser.uid)){
    uploaderArea.classList.remove('hidden');
  }

  // ------------------ safety: prevent huge base64 images (soft) ------------------
  // Not enforced server-side: recommend resizing before upload.
  // Could add client-side resizing, but leaving it simple for now.

  // ------------------ done ------------------
  console.log('Meme board loaded. Poster UIDs:', Array.from(posterUIDs));

  </script>
